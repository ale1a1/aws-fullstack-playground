service: users-api

provider:
  name: aws
  runtime: nodejs18.x
  region: eu-west-2
  httpApi:
    cors: true
  environment:
    DB_URL: ${env:DB_URL, ''}

functions:
  getUsers:
    handler: handler.getUsers
    events:
      - httpApi:
          path: /users
          method: GET

  getUser:
    handler: handler.getUser
    events:
      - httpApi:
          path: /users/{id}
          method: GET

  createUser:
    handler: handler.createUser
    events:
      - httpApi:
          path: /users
          method: POST

  updateUser:
    handler: handler.updateUser
    events:
      - httpApi:
          path: /users/{id}
          method: PUT

  deleteUser:
    handler: handler.deleteUser
    events:
      - httpApi:
          path: /users/{id}
          method: DELETE
